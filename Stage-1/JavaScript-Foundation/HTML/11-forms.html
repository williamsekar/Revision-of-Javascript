<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <form action="">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" />
      <label for="password">Password:</label>
      <input type="password" name="password" id="password" />
      <label for="email">Email:</label>
      <input type="email" name="email" id="email" />
      <label for="age">Age:</label>
      <input type="number" name="age" id="age" />
      <label for="date">Date:</label>
      <input type="date" name="data" id="date" />
      <label for="time">Time:</label>
      <input type="time" name="time" id="time" />
      <label for="color">Color:</label>
      <input type="color" name="color" id="color" />
      <label for="range">Range:</label>
      <input type="range" name="range" id="range" />
      <label for="search">Search:</label>
      <input type="search" name="search" id="search" />
      <label for="file">File:</label>
      <input type="file" name="file" id="file" />
      <label for="url">Url:</label>
      <input type="url" name="url" id="url" />
      <label for="tel">Telephone:</label>
      <input type="tel" name="tel" id="tel" />
      <label for="gender">Gender:</label>
      <input type="radio" name="gender" value="male" id="male" /> Male
      <input type="radio" name="gender" value="female" id="female" /> Female
      <label for="course">Course:</label>
      <fieldset>
        <legend>Choose your course:</legend>
        <input type="checkbox" name="course" value="C" id="course-1" />
        <label for="course-1">C</label>
        <input
          type="checkbox"
          name="course"
          value="C++"
          id="course-2"
          checked
        />
        <label for="course-2">C++</label>
        <input type="checkbox" name="course" value="C#" id="course-3" />
        <label for="course-3">C#</label>
      </fieldset>
      <label for="select">Movie:</label>
      <select name="movie" id="movie">
        <option value="-">Choose option</option>
        <optgroup label="Marvel">
          <option value="ironman">Ironman</option>
          <option value="moon night">Moon night</option>
          <option value="endgame">Endgame</option>
        </optgroup>
        <optgroup label="Dc">
          <option value="batman">Batman</option>
          <option value="superman">Superman</option>
          <option value="aquaman">Aquaman</option>
        </optgroup>
        <option value="others">Others</option>
      </select>
      <textarea name="feedback" id="feedback" rows="10" cols="30">
Feedback:
      </textarea>
      <button id="greet">Click Me</button>
      <input type="submit" value="submit" />
    </form>
  </body>
  <script>
    let btn = document.querySelector("#greet");
    btn.addEventListener("click", () => {
      console.log("Hello!");
    });
  </script>
</html>
