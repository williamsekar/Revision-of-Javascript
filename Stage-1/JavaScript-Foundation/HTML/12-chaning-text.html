<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>Changing Text</title>
  </head>
  <body>
    <h1>Welcome</h1>
    <span>Please come in</span>
  </body>
  <script>
    let heading = document.querySelector("h1");
    let message = document.querySelector("span");

    heading.textContent = "Javascript";
    message.innerHTML = "<p>Programming Language</p>";
  </script>
</html>
