<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generic Container</title>
  </head>
  <body>
    <!--Div block container-->
    <div>
      <h1>Welcome</h1>
      <p>Hello, William</p>
    </div>
    <!--Span inline container-->
    <span>This is my small paragraph</span>
  </body>
  <script>
    let block = document.querySelector("div");
    let inline = document.querySelector("span");

    block.style.backgroundColor = "red";
    inline.style.backgroundColor = "orange";
  </script>
</html>
