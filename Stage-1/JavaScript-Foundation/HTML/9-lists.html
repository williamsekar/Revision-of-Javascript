<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
  </head>
  <body>
    <!--Unordered list-->
    <ul>
      <li>Apple</li>
      <li>Orange</li>
      <li>Banana</li>
      <li>Mango</li>
    </ul>
    <!--Ordered list-->
    <ol>
      <li>Lion</li>
      <li>Parrot</li>
      <li>Tiger</li>
      <li>Wolf</li>
    </ol>
  </body>
</html>
