<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Stage-4.css">
    <title>Units</title>
</head>

<body>
    <!-- Absolute  unit
            px
            pt
            cm
            mm
            in
    -->
    <p style="font-size: 20px;">apple</p>
    <p style="font-size: 20pt;">banana</p>
    <p style="font-size: 1cm;">orange</p>
    <p style="font-size: 5mm;">mango</p>
    <p style="font-size: 0.25in;">pineapple</p>

    <!-- Relative unit 
            %
            em
            rem
            vw
            vh
            vmin
            vmax
    -->
    <div class="test-1">
        <p>Tamil</p>
    </div>
    <div class="test-2">
        <p>English</p>
    </div>
    <div class="test-3">
        <p>Telgu</p>
    </div>
    <div class="test-4">
        <p>Kanada</p>
    </div>
    <div class="test-5">
        <p>Korean</p>
    </div>
    <div class="test-6">
        <p>Japanese</p>
    </div>
    <div class="test-7">
        <p>Malayalam</p>
    </div>
    <div class="test-8">
        <p>Hindi</p>
    </div>
</body>

</html>
